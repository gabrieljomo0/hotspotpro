# HotspotPro API with public UDP RADIUS (cloud voucher login).
# Deploy:  fly launch --no-deploy   then   fly ips allocate-v4   then   fly secrets set ...
#          fly deploy
# MikroTik /radius address = the dedicated IPv4 from `fly ips list`.

app = "hotspotpro-api"
primary_region = "lhr"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  HOTSPOTPRO_RADIUS = "on"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[services]]
  internal_port = 1812
  protocol = "udp"
  [[services.ports]]
    port = 1812

[[services]]
  internal_port = 1813
  protocol = "udp"
  [[services.ports]]
    port = 1813

# Cloud WinBox: admin PC → dedicated IPv4:8291 → Back-To-Home tunnel on this VM → router.
[[services]]
  internal_port = 8291
  protocol = "tcp"
  [[services.ports]]
    port = 8291

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
