# The API, router setup, and check-in (HTTPS).
# WiFi opens the HotspotPro site portal (Vercel).
# Render cannot receive public UDP 1812/1813. Cloud RADIUS works by:
#   HOTSPOTPRO_RADIUS=on + HOTSPOTPRO_RADIUS_LISTEN=off + HOTSPOTPRO_RADIUS_HOST=<public IPv4>
# and running `node scripts/radius-edge.mjs` on that public IP (forwards UDP → /api/radius/edge).
# Or deploy the full API on Fly/Docker with UDP (see deploy/DEPLOY.md).
services:
  - type: web
    name: hotspotpro-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOTSPOTPRO_RADIUS
        value: on
      - key: HOTSPOTPRO_RADIUS_LISTEN
        value: off
      - key: HOTSPOTPRO_RADIUS_HOST
        sync: false
      - key: HOTSPOTPRO_RADIUS_SECRET
        sync: false
      - key: HOTSPOTPRO_SESSION_SECRET
        generateValue: true
      - key: HOTSPOTPRO_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
