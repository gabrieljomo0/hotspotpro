# HotspotPro API on Render (HTTPS check-in, jobs, packages, vouchers).
# WiFi portal UI stays on Vercel (HOTSPOTPRO_PORTAL_URL).
#
# Render cannot receive public UDP 1812/1813. Keep:
#   HOTSPOTPRO_RADIUS=on
#   HOTSPOTPRO_RADIUS_LISTEN=off
#   HOTSPOTPRO_RADIUS_HOST=<public IPv4 of radius-edge / Fly / VPS>
# and run `node scripts/radius-edge.mjs` on that IP (see deploy/DEPLOY.md).
#
# Persist data with SUPABASE_* (Render's free disk is wiped on deploy).
# Prefer Starter (always-on) over Free — Free sleeps and routers miss check-ins.
services:
  - type: web
    name: hotspotpro-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOTSPOTPRO_RADIUS
        value: on
      - key: HOTSPOTPRO_RADIUS_LISTEN
        value: off
      - key: HOTSPOTPRO_RADIUS_HOST
        sync: false
      - key: HOTSPOTPRO_RADIUS_SECRET
        sync: false
      - key: HOTSPOTPRO_SESSION_SECRET
        generateValue: true
      - key: HOTSPOTPRO_PUBLIC_URL
        value: https://hotspotpro-api.onrender.com
      - key: HOTSPOTPRO_PORTAL_URL
        value: https://hotspotpro-mu.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
