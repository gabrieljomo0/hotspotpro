# The API, router setup, and check-in.
# WiFi opens the designed HotspotPro site portal (Vercel).
# Render cannot receive public UDP, so MikroTik RADIUS (1812/1813) stays off.
# Vouchers are authenticated by this API, then pushed onto the MikroTik at Connect.
# Set HOTSPOTPRO_RADIUS=on only on a host that exposes UDP 1812/1813 to the internet.
services:
  - type: web
    name: hotspotpro-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOTSPOTPRO_RADIUS
        value: off
      - key: HOTSPOTPRO_SESSION_SECRET
        generateValue: true
      - key: HOTSPOTPRO_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
