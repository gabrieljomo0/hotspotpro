# The API, router setup, and 30-second check-in.
# MikroTik RADIUS (UDP 1812/1813) is not reachable from the public internet on
# Render, so it stays off here. Routers added to this site use "On the router".
services:
  - type: web
    name: hotspotpro-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOTSPOTPRO_RADIUS
        value: off
      - key: HOTSPOTPRO_SESSION_SECRET
        generateValue: true
      - key: HOTSPOTPRO_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
